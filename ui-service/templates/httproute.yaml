{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ default (printf "%s-httproute" (include "ui.fullname" .)) .Values.httproute.name }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
  {{- with .Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.httproute.parentRefs }}
    - name: {{ .gatewayName }}
      {{- if .gatewayNamespace }}
      namespace: {{ .gatewayNamespace }}
      {{- end }}
      {{- if .gatewayKind }}
      kind: {{ .gatewayKind }}
      {{- end }}
      {{- if .gatewaySectionName }}
      sectionName: {{ .gatewaySectionName }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- range .Values.httproute.rules }}
    - matches:
        {{- range .matches }}
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | default "/" }}
        {{- end }}
      backendRefs:
        - name: {{ include "ui.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
