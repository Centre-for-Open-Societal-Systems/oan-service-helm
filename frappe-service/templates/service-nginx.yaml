apiVersion: v1
kind: Service
metadata:
  name: {{ include "frappe.fullname" . }}
  labels:
    {{- include "frappe.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "frappe.name" . }}-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}-nginx
