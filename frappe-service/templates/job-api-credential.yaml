{{- if .Values.apiCredential.enabled }}
{{/*
Runs on every install and upgrade. Waits until create-site has installed the last app of
jobs.createSite.installApps, then sets api_key and api_secret of each listed User from a
Secret. The Secret holds `token <api_key>:<api_secret>`, the same value a gateway sends in
the Authorization header, so one Secret is the source of truth for both ends. A User whose
credential already matches is left alone. A missing User fails the Job.
*/}}
{{- $site := .Values.jobs.createSite.siteName }}
{{- $lastApp := "frappe" }}
{{- with .Values.jobs.createSite.installApps }}{{ $lastApp = last . }}{{ end }}
{{- if not .Values.apiCredential.users }}
{{- fail "apiCredential.users must list at least one user when apiCredential.enabled is true" }}
{{- end }}
{{- $users := dict }}
{{- range $i, $u := .Values.apiCredential.users }}
{{- $_ := set $users (required "apiCredential.users[].user is required" $u.user) (printf "API_CREDENTIAL_%d" $i) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "frappe.fullname" . }}-api-credential-{{ now | date "20060102150405" }}
  labels:
    {{- include "frappe.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.apiCredential.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.apiCredential.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ template "frappe.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: api-credential
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        workingDir: /home/frappe/frappe-bench/sites
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          until [ -f "$SITE_NAME/site_config.json" ] && (cd .. && bench --site "$SITE_NAME" list-apps 2>/dev/null) | grep -q '^{{ $lastApp }}'; do
            echo "waiting for site $SITE_NAME"; sleep 10
          done
          /home/frappe/frappe-bench/env/bin/python - <<'PYEOF'
          import json, os
          import frappe

          frappe.init(site=os.environ["SITE_NAME"], sites_path=".")
          frappe.connect()
          for user, env in json.loads(os.environ["API_CREDENTIAL_ENV"]).items():
              value = os.environ.get(env, "")
              if not value.startswith("token ") or value.count(":") != 1:
                  raise SystemExit(f"{env}: expected 'token <api_key>:<api_secret>'")
              key, secret = value[len("token "):].split(":")
              if not frappe.db.exists("User", user):
                  raise SystemExit(f"User {user} does not exist")
              doc = frappe.get_doc("User", user)
              current = frappe.utils.password.get_decrypted_password("User", user, "api_secret", raise_exception=False)
              if doc.api_key == key and current == secret:
                  print(f"api credential unchanged for {user}")
                  continue
              doc.api_key = key
              doc.api_secret = secret
              doc.save(ignore_permissions=True)
              print(f"api credential set for {user}")
          frappe.db.commit()
          frappe.destroy()
          PYEOF
        env:
        - name: SITE_NAME
          value: {{ $site | quote }}
        - name: API_CREDENTIAL_ENV
          value: {{ toJson $users | quote }}
        {{- range $i, $u := .Values.apiCredential.users }}
        - name: API_CREDENTIAL_{{ $i }}
          valueFrom:
            secretKeyRef:
              name: {{ required "apiCredential.users[].secretName is required" $u.secretName }}
              key: {{ default "authorization" $u.secretKey }}
        {{- end }}
        {{- with .Values.apiCredential.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: sites-dir
          mountPath: /home/frappe/frappe-bench/sites
          {{- if .Values.persistence.worker.subPath }}
          subPath: {{ .Values.persistence.worker.subPath | quote }}
          {{- end }}
      volumes:
      - name: sites-dir
        persistentVolumeClaim:
          claimName: {{ default (include "frappe.fullname" .) .Values.persistence.worker.existingClaim }}
{{- end }}
