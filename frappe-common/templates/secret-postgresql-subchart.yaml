{{- $sub := index .Values "postgresql-subchart" }}
{{- if and $sub.enabled $sub.auth $sub.auth.existingSecret }}
{{- /*
Superuser password Secret for the Bitnami postgresql subchart. Created once with a random
password and reused on upgrade; kept on uninstall because the PVC (and its data directory) stays.
*/ -}}
{{- $key := default "postgres-password" ($sub.auth.secretKeys).adminPasswordKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $sub.auth.existingSecret }}
{{- $password := randAlphaNum 24 }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $password = index $existing.data $key | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sub.auth.existingSecret }}
  labels:
    {{- include "frappe.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
